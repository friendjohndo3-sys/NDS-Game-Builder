```yaml
name: Nintendo DS and 3DS Builder

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Select target platform"
        required: true
        type: choice
        options:
          - ds
          - 3ds

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc g++ git

      - name: Install devkitPro
        run: |
          git clone --depth 1 https://github.com/devkitPro/pacman-packages.git /tmp/devkitpro-packages
          echo "This runner needs the devkitPro toolchain to compile Nintendo binaries."

      - name: Check project
        run: |
          echo "Selected platform: ${{ inputs.platform }}"
          echo "Checking repository files..."
          find . -maxdepth 3 -type f | head -200

      - name: Build Nintendo DS
        if: ${{ inputs.platform == 'ds' }}
        run: |
          if [ ! -f Makefile ] && [ ! -f makefile ]; then
            echo "::error::No root Makefile found. Configure the DS project build first."
            exit 1
          fi
          make

      - name: Build Nintendo 3DS
        if: ${{ inputs.platform == '3ds' }}
        run: |
          if [ ! -f Makefile ] && [ ! -f makefile ]; then
            echo "::error::No root Makefile found. Configure the 3DS project build first."
            exit 1
          fi
          make

      - name: Collect compiled files
        run: |
          mkdir -p build-output
          find . -type f \
            \( -name '*.nds' -o -name '*.3dsx' \
               -o -name '*.cia' -o -name '*.elf' \) \
            -not -path './.git/*' \
            -exec cp {} build-output/ \;

          if [ -z "$(find build-output -type f -print -quit)" ]; then
            echo "::error::No Nintendo binaries were produced."
            exit 1
          fi

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: nintendo-${{ inputs.platform }}-build
          path: build-output/
          if-no-files-found: error
```
