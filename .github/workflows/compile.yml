      - name: Fix outdated 3DS Makefile paths
        if: steps.detect.outputs.target == '3ds'
        shell: bash
        run: |
          set -euo pipefail

          cd /tmp/nintendo-project

          echo "Searching Makefiles for outdated devkitPro paths..."

          while IFS= read -r -d '' file; do
            if grep -qF '/opt/devkitpro/libctru/base_tools' "$file"; then
              echo "Found outdated path in: $file"

              sed -i \
                's|/opt/devkitpro/libctru/base_tools|/opt/devkitpro/devkitARM/base_rules|g' \
                "$file"
            fi
          done < <(
            find . -type f \
              \( -iname 'Makefile' -o -iname 'makefile' \) \
              -print0
          )

          echo "Checking the Makefile..."

          grep -R -n -F \
            '/opt/devkitpro/libctru/base_tools' \
            --include='Makefile' \
            --include='makefile' \
            . && {
              echo "::error::The outdated path still exists."
              exit 1
            } || true
