```yaml
name: Nintendo DS and 3DS Compiler

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Choose the Nintendo platform"
        required: true
        type: choice
        options:
          - ds
          - 3ds

      build_cia:
        description: "Build CIA too (3DS projects only)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile Nintendo ${{ inputs.platform }}
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify toolchain
        shell: bash
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          test -n "$DEVKITPRO"
          test -n "$DEVKITARM"

          arm-none-eabi-gcc --version
          make --version

      - name: Select project
        id: project
        shell: bash
        run: |
          echo "path=projects/${{ inputs.platform }}" >> "$GITHUB_OUTPUT"

      - name: Check project files
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.path }}"

          if [ ! -f "$PROJECT/Makefile" ]; then
            echo "::error::No Makefile found at $PROJECT/Makefile"
            exit 1
          fi

          mkdir -p build-output

      - name: Build Nintendo DS
        if: inputs.platform == 'ds'
        shell: bash
        run: |
          cd projects/ds
          make

          find . -type f \
            \( -name '*.nds' -o -name '*.elf' \) \
            -exec cp {} ../../build-output/ \;

      - name: Build Nintendo 3DS
        if: inputs.platform == '3ds'
        shell: bash
        run: |
          cd projects/3ds
          make

          find . -type f \
            \( -name '*.3dsx' -o -name '*.elf' \
               -o -name '*.smdh' \) \
            -exec cp {} ../../build-output/ \;

      - name: Build Nintendo 3DS CIA
        if: inputs.platform == '3ds' && inputs.build_cia
        shell: bash
        run: |
          cd projects/3ds
          make cia

          find . -type f -name '*.cia' \
            -exec cp {} ../../build-output/ \;

      - name: Verify build outputs
        shell: bash
        run: |
          if [ -z "$(find build-output -type f -print -quit)" ]; then
            echo "::error::The build produced no recognized output files."
            exit 1
          fi

          echo "Build outputs:"
          find build-output -type f -printf '%p (%s bytes)\n'

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: nintendo-${{ inputs.platform }}-build
          path: build-output/
          if-no-files-found: error
          retention-days: 14
```
